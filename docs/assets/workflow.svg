<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="LiveReview 数据流程：授权直播源、采集转写、证据点评、复盘行动">
<rect width="1200" height="220" rx="18" fill="#101a24"/><g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><text x="35" y="40" fill="#88a4b2" font-size="12" letter-spacing="2">THE REVIEW LOOP</text><g fill="#172a34" stroke="#2b414e"><rect x="35" y="70" width="250" height="102" rx="12"/><rect x="325" y="70" width="250" height="102" rx="12"/><rect x="615" y="70" width="250" height="102" rx="12"/><rect x="905" y="70" width="260" height="102" rx="12"/></g><g fill="#6be1c3" font-size="22"><text x="297" y="128">→</text><text x="587" y="128">→</text><text x="877" y="128">→</text></g><g font-size="18" fill="#e4eef3" font-weight="600"><text x="56" y="108">授权直播源</text><text x="346" y="108">采集与转写</text><text x="636" y="108">证据与点评</text><text x="926" y="108">复盘与行动</text></g><g font-size="13" fill="#95adb9"><text x="56" y="143">直播链接 · 主播轮班 · 知识库</text><text x="346" y="143">FFmpeg · ASR · OCR · 弹幕</text><text x="636" y="143">原话时间线 · 分段分析 · 回放</text><text x="926" y="143">整场总结 · 人工判断 · 下一场目标</text></g><text x="35" y="202" fill="#7894a1" font-size="11">本地 SQLite 保存文本与结构化数据；媒体可保存在本地，或使用自有 COS。模型密钥只由后端读取。</text></g></svg>
